name: Secret Scan

# Diff-scoped gitleaks. Scans only what a push or PR introduces, never the
# whole history — so pre-existing findings (mostly placeholder credentials in
# test fixtures) don't fire on unrelated changes, and the signal stays high.
# Tuning lives in .gitleaks.toml, including rules for Anthropic and OpenRouter
# keys, which the stock gitleaks ruleset does not cover.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks (diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # need history to diff against the base

      - name: Install gitleaks (pinned, checksummed)
        run: |
          set -euo pipefail
          GL_VERSION=8.24.3
          GL_SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          GL_TARBALL=gitleaks_${GL_VERSION}_linux_x64.tar.gz
          curl -sSfL -o "$GL_TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/${GL_TARBALL}"
          echo "${GL_SHA256}  ${GL_TARBALL}" | sha256sum -c -
          tar -xzf "$GL_TARBALL" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$GL_TARBALL"
          gitleaks version

      - name: Scan for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CFG="${PWD}/.gitleaks.toml"

          # Wrapper rather than a bare call: gitleaks exits 0 when git itself
          # rejects its arguments, reporting a "partial scan" of ~0 bytes. A
          # check that silently scans nothing is worse than no check, so treat
          # that as a failure instead of a pass.
          scan() {
            local out status
            set +e
            out=$(gitleaks detect --config "$CFG" --redact --exit-code 1 "$@" 2>&1)
            status=$?
            set -e
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -q "failed to scan\|partial scan"; then
              echo "::error::gitleaks could not complete the scan — failing rather than passing on an empty result."
              return 1
            fi
            return "$status"
          }

          # Merging the default branch into a feature branch creates a merge
          # commit whose diff carries everything the merge brought in, so a
          # plain BEFORE..AFTER range re-scans history the branch never
          # introduced and reports other people's pre-existing findings. (Seen
          # for real: one such push scanned 60 MB and reported 74 "leaks", none
          # of them from the branch.) Excluding commits already reachable from
          # the default branch keeps the scan to what this push actually adds.
          EXCLUDE=""
          if [ -n "${DEFAULT_BRANCH:-}" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ] \
            && git fetch --no-tags --quiet origin "$DEFAULT_BRANCH" 2>/dev/null; then
            EXCLUDE=" --not origin/${DEFAULT_BRANCH}"
          fi

          # A branch whose earlier PRs were squash-merged keeps every original
          # commit forever — squashing puts new commits on the default branch,
          # so the branch's own history is never an ancestor of it. On one
          # long-lived branch here that was 78 commits, and the range scan
          # reported 81 findings from repo test fixtures the change never
          # touched. Restricting the walk to the paths the change actually
          # affects keeps the scan about the change.
          #
          # The trade-off, stated plainly: a secret added and then fully
          # deleted within the branch is no longer walked, because its file is
          # not in the final diff. Everything present in the result — including
          # merge resolutions, via the working-tree pass below — still is.
          # Skipped when a path contains whitespace (--log-opts is split on
          # spaces) or when the change is very wide, where the argument list
          # gets unwieldy and the stale-history problem is not the issue.
          PATHSPEC=""
          set_pathspec() {
            local paths=() status src dst f
            # NUL-delimited: git quotes and backslash-escapes paths containing
            # non-ASCII bytes, tabs or newlines in its default output, and that
            # display form is not a usable pathspec.
            #
            # Both sides of a rename are included. Limiting the walk to the
            # destination alone hides the source, so git cannot pair them and
            # renders the rename as a wholesale addition — which makes a pure
            # rename of a file containing a known credential look like that
            # credential was just introduced. With both paths in scope it is
            # correctly seen as a move and reports nothing.
            while IFS= read -r -d '' status; do
              case "$status" in
                R*|C*) IFS= read -r -d '' src; IFS= read -r -d '' dst
                       paths+=("$src" "$dst") ;;
                *)     IFS= read -r -d '' dst
                       paths+=("$dst") ;;
              esac
            done < <(git diff -M --name-status -z "$1" HEAD)
            [ "${#paths[@]}" -gt 0 ] || return 0
            [ "${#paths[@]}" -le 200 ] || return 0
            # --log-opts is split on spaces, so a path containing whitespace
            # cannot be passed this way. Checked per path, not on the joined
            # list, whose separators are not part of any filename.
            local literal=()
            for f in "${paths[@]}"; do
              case "$f" in *[[:space:]]*) return 0 ;; esac
              # A tracked name beginning with pathspec magic — a file literally
              # called ":(literal)foo" — is otherwise read as a *request* for a
              # different path, and the file itself is never walked. Prefixing
              # disables the pathspec language for every generated name.
              literal+=(":(literal)${f}")
            done
            PATHSPEC=" -- ${literal[*]}"
          }

          BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            BASE=$(git merge-base "origin/${BASE_REF}" HEAD)
            set_pathspec "$BASE"
            echo "Scanning PR diff: ${BASE}..HEAD${PATHSPEC}"
            scan --log-opts="${BASE}..HEAD${PATHSPEC}"
          elif [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            BASE="$BEFORE_SHA"
            echo "Scanning push diff: ${BEFORE_SHA}..${AFTER_SHA}${EXCLUDE}"
            scan --log-opts="${BEFORE_SHA}..${AFTER_SHA}${EXCLUDE}"
          elif [ -n "${DEFAULT_BRANCH:-}" ] && [ "$REF_NAME" != "$DEFAULT_BRANCH" ] \
            && NB=$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null); then
            # A brand-new branch arrives with an all-zero before-SHA, and it can
            # publish many commits at once. Falling straight to HEAD~1 scanned
            # only the last of them, so a credential added in an earlier commit
            # of that same push — still present in HEAD — was missed by the
            # range scan *and* by the content pass, which shares this base.
            # Diverging from the default branch covers the whole newly
            # published history.
            BASE="$NB"
            # Same scoping as any other feature-branch range scan: exclude what
            # the default branch already has, and restrict to the paths this
            # branch actually touches. Without those, a branch carrying
            # squash-merged history re-reports every fixture in it — the
            # round-16 failure, reintroduced by widening the base.
            set_pathspec "$NB"
            echo "Scanning new branch: ${NB}..HEAD${EXCLUDE}${PATHSPEC} (before-SHA absent)"
            scan --log-opts="${NB}..HEAD${EXCLUDE}${PATHSPEC}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE="HEAD~1"
            echo "Scanning latest commit (parent SHA unavailable, no default branch)"
            scan --log-opts="HEAD~1..HEAD"
          else
            echo "Scanning root commit"
            scan --log-opts="HEAD"
          fi

          # The log-based scan above cannot see content that exists only in a
          # merge commit: gitleaks walks per-commit diffs and never attributes a
          # merge's conflict resolution to anything. Verified against this
          # pinned version — a key introduced solely in a resolution is missed
          # even by a full-history scan, and turns up only in a working-tree
          # (--no-git) scan. So also scan the final content of the files this
          # push touched, which is where such a resolution lands. Scoping it to
          # changed files keeps the noise properties of a diff-scoped check:
          # untouched files with pre-existing findings are never re-reported.
          #
          # "Changed" is measured against the default branch on a *push*, not
          # against the before-SHA: on a push that merges the default branch in,
          # the before-SHA predates that merge, so diffing against it names
          # every file the merge brought along — 7375 of them in the run that
          # prompted this, and 126 findings from files the branch never edited.
          #
          # A pull request keeps its own target branch. Substituting the default
          # branch here would scan and baseline the wrong diff whenever a PR
          # targets a non-default branch: fixtures on the target would be
          # re-reported, and a credential present only on the default branch
          # would exempt the same value newly introduced into the target.
          #
          # TWO bases, because one commit cannot answer both questions. Trying
          # to make it do so produced a false positive in each direction across
          # two rounds of review:
          #
          #   * Merge base alone. Squashing puts a *new* commit on the target,
          #     so this branch's commits never become its ancestors and the
          #     merge base stays at the original divergence point. Everything
          #     already squash-merged then reads as changed and its accepted
          #     findings are re-reported.
          #   * Target tip alone. A branch that is merely *behind* the target
          #     differs from it wherever the target moved on. If the target
          #     deleted a flagged value after divergence, this branch still has
          #     it, the diff names that file, and it reports as introduced —
          #     by a push that never touched it.
          #
          # So: DIFF_BASE (merge base) selects *which files*, giving the set
          # this branch actually changed rather than everything the target
          # changed underneath it. CONTENT_BASE (target tip) supplies the
          # *exemption baseline*, so a value the target already ships — however
          # it got there, squash merge included — is not reported again.
          #
          # Each earlier failure is answered by a different half. Squash-merged
          # content is still in the file set, but its value is present at the
          # tip, so it is exempt. Target-only changes are not in the file set at
          # all. A genuinely new value is in the set and absent from the tip.
          #
          # The *range* scan above uses the merge base too, which is correct
          # there: it walks commits since divergence, not final content.
          #
          # A push to the default branch uses the push's own before-SHA. It is
          # the only branch where that is the right baseline *and* the only one
          # where the tip is useless — `origin/main` is where we already are, so
          # it would name no changed files at all. The stale-divergence problem
          # that motivates the tip elsewhere cannot arise here either: on the
          # default branch the before-SHA is that branch's own previous tip, not
          # a point some feature branch diverged from.
          #
          # This case was skipped between the round-16 rewrite and now, and the
          # comment that replaced it asserted the skip was "same as before". It
          # was not: before that rewrite a push fell through to $BASE, which is
          # the before-SHA. So a merge commit pushed straight to the default
          # branch had its resolution scanned, then silently stopped being
          # scanned — the exact gap the content pass exists to close, reopened
          # on the one branch that ships.
          #
          # A feature-branch push with no reachable default branch still skips,
          # deliberately: its before-SHA predates any merge of the default
          # branch, and diffing against it names everything that merge carried
          # along (7375 files and 126 unrelated findings in the run that first
          # exposed this). Losing merge-resolution coverage on a branch whose
          # own PR will be scanned properly beats failing every unrelated PR.
          # On the default branch the two collapse to the same commit: there is
          # no divergence to measure, and the tip is where we already are.
          DIFF_BASE=""; CONTENT_BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_BASE="$BASE"; CONTENT_BASE="origin/${BASE_REF}"
          elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            DIFF_BASE="$BASE"; CONTENT_BASE="$BASE"
          elif [ -n "$EXCLUDE" ] \
            && MB=$(git merge-base "origin/${DEFAULT_BRANCH}" HEAD 2>/dev/null); then
            DIFF_BASE="$MB"; CONTENT_BASE="origin/${DEFAULT_BRANCH}"
            # The file set is branch-wide, so a finding an *earlier* commit on
            # this branch introduced is re-reported on every later push: the
            # target cannot exempt it, because it is not on the target. The
            # range scan does not behave that way — it walks BEFORE..AFTER, so
            # it reports a given commit once. Exempting whatever the branch
            # already had at its previous head makes the content pass agree:
            # only what *this push* adds is new. The push that introduced it
            # still fails, since at that push's BEFORE it was not there, and
            # the PR event keeps the branch-wide view because it has no
            # previous head to exempt from.
            PREV_BASE="$BASE"
          fi

          if [ -n "$DIFF_BASE" ]; then
            # One root for everything, so the trap really does remove it all.
            # The reports below are UNREDACTED — they exist to compare secret
            # values — and an earlier version wrote them as siblings of the temp
            # dirs while claiming they were trap-cleaned. They were not, and
            # would have outlived the step on the runner.
            WORK=$(mktemp -d)
            trap 'rm -rf "$WORK"' EXIT
            HEAD_DIR="${WORK}/head"; BASE_DIR="${WORK}/base"
            DEL_DIR="${WORK}/deleted"; PREV_DIR="${WORK}/prev"
            mkdir -p "$HEAD_DIR" "$BASE_DIR" "$DEL_DIR" "$PREV_DIR"
            COUNT=0; DEL_COUNT=0; PREV_COUNT=0
            # -M so a rename is reported as a pair: the baseline for the new
            # path has to come from the *old* path, or a pure rename looks like
            # a file full of brand-new findings. -z for the same quoting reason
            # as above.
            while IFS= read -r -d '' status; do
              case "$status" in
                R*|C*) IFS= read -r -d '' src; IFS= read -r -d '' dst ;;
                D*)    IFS= read -r -d '' dst
                       # A deletion has no HEAD side, but it must still appear
                       # on the BASE side. The comparison is a multiset over
                       # (rule, secret): if a value that lived in a deleted file
                       # resurfaces in a file that survived — a merge resolution
                       # moving a block, which -M does not see as a rename
                       # because the whole file did not move — omitting the
                       # deleted file leaves that value with a base count of
                       # zero, and its HEAD occurrence reads as newly
                       # introduced. It was in the base tree the whole time.
                       #
                       # COUNT is deliberately not incremented: it gates the
                       # scan on there being HEAD content worth scanning, and a
                       # change that only deletes files adds nothing.
                       #
                       # Its own tree, not BASE_DIR, because a file and a
                       # directory cannot share a name. Replacing the file `a`
                       # with a package `a/` is an ordinary refactor and git
                       # reports it as `D a` + `A a/__init__.py`; writing the
                       # deleted blob to BASE_DIR/a then makes the later
                       # `mkdir -p BASE_DIR/a` fail, and under `set -e` the job
                       # aborts on a change containing no secret at all.
                       # Deletions cannot collide with each other — one commit
                       # cannot have the same path as both a file and a
                       # directory — so a separate tree is collision-free.
                       # Relative layout is preserved rather than flattened
                       # because .gitleaks.toml has path-scoped allowlist
                       # entries; flattening would apply them to one side only.
                       dparent="${dst%/*}"; [ "$dparent" = "$dst" ] && dparent="."
                       mkdir -p "${DEL_DIR}/${dparent}"
                       if git show "${CONTENT_BASE}:${dst}" \
                            > "${DEL_DIR}/${dst}" 2>/dev/null; then
                         DEL_COUNT=$((DEL_COUNT + 1))
                       fi
                       continue ;;
                *)     IFS= read -r -d '' dst; src="$dst" ;;
              esac

              # Materialize the blob git stores, rather than copying from the
              # working tree. `cp` follows symlinks, so a tracked path that
              # resolves to a symlink would have its *target's* content scanned
              # instead of the link blob git actually holds — and `[ -f ]`
              # skips it entirely when the target dangles. `git show` gives the
              # stored bytes for every kind of tracked path.
              # Parameter expansion, not $(dirname): command substitution
              # strips trailing newlines, so a directory component ending in one
              # ("dir\n/file") would be created as "dir" and the redirect below
              # would fail — silently skipping the blob via the `continue`.
              parent="${dst%/*}"; [ "$parent" = "$dst" ] && parent="."
              mkdir -p "${HEAD_DIR}/${parent}"
              git show "HEAD:${dst}" > "${HEAD_DIR}/${dst}" 2>/dev/null || continue
              # The base side is written under the *destination* path so a
              # rename compares against its source. Absent at the base (a
              # genuinely new file) means nothing is exempt in it.
              #
              # Destination first, source only as a fallback. `src` is a name
              # from the rename detection, which runs against DIFF_BASE, but
              # this reads from CONTENT_BASE — and since the two-base split
              # those are different revisions. A rename that was already
              # squash-merged is still reported as `R old new` relative to the
              # merge base, while the target has only `new`; looking up `old`
              # there finds nothing, leaves an empty baseline, and re-reports
              # every existing finding in `new` on an unrelated push. When the
              # target already has the destination, that is the right baseline
              # for it. `src` still covers a rename the target has not seen.
              mkdir -p "${BASE_DIR}/${parent}"
              git show "${CONTENT_BASE}:${dst}" > "${BASE_DIR}/${dst}" 2>/dev/null \
                || git show "${CONTENT_BASE}:${src}" > "${BASE_DIR}/${dst}" 2>/dev/null \
                || true
              if [ -n "${PREV_BASE:-}" ]; then
                mkdir -p "${PREV_DIR}/${parent}"
                if git show "${PREV_BASE}:${dst}" > "${PREV_DIR}/${dst}" 2>/dev/null \
                   || git show "${PREV_BASE}:${src}" > "${PREV_DIR}/${dst}" 2>/dev/null; then
                  PREV_COUNT=$((PREV_COUNT + 1))
                fi
              fi
              COUNT=$((COUNT + 1))
            done < <(git diff -M --name-status -z "$DIFF_BASE" HEAD)

            if [ "$COUNT" -gt 0 ]; then
              echo "Scanning stored content of ${COUNT} file(s) changed since ${DIFF_BASE}, baselined on ${CONTENT_BASE}"
              # Compared by the secret's VALUE, not via gitleaks --baseline-path:
              # a baseline entry matches on location plus Entropy, and Entropy is
              # a rounded float over the secret's characters, so a *different*
              # secret at the same path/rule/line is suppressed whenever the two
              # collide — which any permutation does exactly. Rationale and the
              # verification live in the script's docstring.
              #
              # Reports are unredacted so values can be compared, and are never
              # echoed: the script prints only path/line/rule of anything new.
              content_scan() {  # $1 = dir, $2 = report path
                local log status
                log="${WORK}/$(basename "$1").log"
                set +e
                ( cd "$1" && gitleaks detect --config "$CFG" --no-git --source . \
                    --report-format json --report-path "$2" --exit-code 0 ) \
                    >"$log" 2>&1
                status=$?
                set -e
                # --exit-code 0 means findings are NOT an error, so any nonzero
                # status is a genuine execution failure — killed, panicked, bad
                # arguments. Matching two known log strings covered only the
                # failures I had happened to see.
                if [ "$status" -ne 0 ]; then
                  echo "::error::gitleaks exited ${status} scanning $(basename "$1") — failing rather than passing on an incomplete result."
                  return 1
                fi
                # Same fail-closed rule as the range scan, and applied to BOTH
                # sides: a partial scan that still writes a valid empty report
                # would otherwise read as "nothing found" on either the base
                # (exempting nothing, harmless) or HEAD (exempting everything).
                if grep -q "failed to scan\|partial scan" "$log"; then
                  echo "::error::gitleaks could not complete the content scan of $(basename "$1") — failing rather than passing on an incomplete result."
                  return 1
                fi
                [ -s "$2" ] || echo "[]" > "$2"
              }
              content_scan "$BASE_DIR" "${WORK}/base.json"
              content_scan "$HEAD_DIR" "${WORK}/head.json"
              EXTRA=()
              if [ "$DEL_COUNT" -gt 0 ]; then
                content_scan "$DEL_DIR" "${WORK}/deleted.json"
                EXTRA+=(--extra-base "${WORK}/deleted.json")
              fi
              if [ "$PREV_COUNT" -gt 0 ]; then
                content_scan "$PREV_DIR" "${WORK}/prev.json"
                # --alt-base, not --extra-base: this is an *alternative*
                # snapshot of the same paths, not another slice of the target's.
                # Summing them would exempt two copies of a value each parent
                # holds once, so a merge resolution that duplicates a credential
                # would pass. Combined by maximum instead.
                EXTRA+=(--alt-base "${WORK}/prev.json")
              fi
              python3 scripts/ci/diff_gitleaks_findings.py \
                "${WORK}/base.json" "${WORK}/head.json" "${EXTRA[@]+"${EXTRA[@]}"}"
            fi
          fi

      - name: What to do on a hit
        if: failure()
        run: |
          echo "::notice::gitleaks flagged a secret in this diff."
          echo "If it is real: rotate it first, then remove it from history."
          echo "If it is a placeholder: give it an obvious marker (fake/dummy/"
          echo "example/placeholder) so .gitleaks.toml's allowlist covers it,"
          echo "or add a narrow, commented rule there. Do not add a blanket"
          echo "tests/ exemption."
